name: Deploy Pulzitive Agency to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy directly to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Keep one Pages deployment in flight at a time without cancelling active deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            bun install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Configure & auto-enable GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Run TypeScript check
        run: bun run lint

      - name: Build Vite production bundle for GitHub Pages
        env:
          RAW_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          NORMALIZED_BASE="${RAW_BASE_PATH%/}/"
          echo "Resolved Vite base path: ${NORMALIZED_BASE}"
          VITE_BASE_PATH="${NORMALIZED_BASE}" bun run build

      - name: Prepare SPA 404 fallback, .nojekyll & verify assets
        run: |
          test -f dist/index.html
          test -d dist/drive-assets
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
